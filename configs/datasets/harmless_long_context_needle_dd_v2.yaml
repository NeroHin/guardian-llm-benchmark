version: 1
datasets:
  - key: harmless_long_context_1k_negative_dd_v2
    task: pii_binary
    format: csv
    path: dataset/harmless_long_context_needle_dd_v2.csv
    content_column: 1K_context
    ground_truth:
      mode: fixed
      value: false
    filters:
      - column: validation_status
        equals: passed
    sample:
      default_limit: 100
      shuffle: false
      random_seed: 42

