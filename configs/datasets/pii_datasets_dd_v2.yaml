version: 1
datasets:
  - key: multipriv_pii_negative_clean_dd_v2
    task: pii_binary
    format: csv
    path: dataset/data_person_1000_non_pii_clean_dd_v2.csv
    content_column: naturalParagraph
    ground_truth:
      mode: fixed
      value: false
    filters:
      - column: generation_status
        equals: ok
      - column: validation_status
        equals: passed
    sample:
      default_limit: 100
      shuffle: false
      random_seed: 42

  - key: multipriv_pii_negative_hard_dd_v2
    task: pii_binary
    format: csv
    path: dataset/data_person_1000_non_pii_hard_dd_v2.csv
    content_column: naturalParagraph
    ground_truth:
      mode: fixed
      value: false
    filters:
      - column: generation_status
        equals: ok
      - column: validation_status
        equals: passed
    sample:
      default_limit: 100
      shuffle: false
      random_seed: 42
