version: 1
models:
  - key: granite-openrouter
    model_id: ibm-granite/granite-4.0-h-micro
    provider: openrouter
    params_b: 3.0
    settings:
      temperature: 0
      max_tokens: 128
      response_format: json_object

  - key: gpt41nano-openrouter
