  task: pii_binary
  dataset:
    positive: harmless_long_context_16k_needle_mid_positive
    negative: harmless_long_context_16k_negative
  models:
    include_keys:
      - granite-openrouter
      - gpt41nano-openrouter
      - qwen3guard4b-stream
      - qwen3guard06b-stream
      - granite-micro-hf
      - granite-tiny-hf-1b
      - qwen25-05b-hf
      - qwen25-3b-hf
  runtime:
    sample_limit: 50
    shuffle: true
    random_seed: 42
    fail_fast: false
  outputs:
    dir: results/pii-needle-16k-mid-pair
    save_rows: true
    save_metrics_json: true
