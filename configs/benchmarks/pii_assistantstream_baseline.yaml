version: 1
benchmark:
  key: pii-assistantstream-baseline
  task: pii_binary
  dataset:
    positive: multipriv_pii_positive
    negative: multipriv_pii_negative
  models:
    include_keys:
      - granite-openrouter
      - gpt41nano-openrouter
      - qwen3guard4b-assistantstream
      - qwen3guard06b-assistantstream
      - nemotron-h-4b-16k
      - granite-micro
      - granite-tiny-1b
      - qwen25-05b
      - qwen25-3b
  runtime:
    sample_limit: 100
    batch_size: 1
    shuffle: true
    random_seed: 42
    fail_fast: false
  outputs:
    dir: results/pii-assistantstream-baseline
    save_rows: true
    save_metrics_json: true
