version: 1
benchmark:
  key: pii-baseline
  task: pii_binary
  dataset:
    positive: multipriv_pii_positive
    negative: multipriv_pii_negative
  models:
    include_keys:
      - qwen3guard06b-stream
      - granite-micro-hf
