version: 1
benchmark:
  key: pii-baseline
  task: pii_binary
  dataset:
    positive: multipriv_pii_positive
    negative: multipriv_pii_negative
  models:
    include_keys:
      - granite-openrouter
      - gpt41nano-openrouter
      - qwen3guard4b-userpass
      - qwen3guard06b-userpass
      - granite-micro-hf
      - granite-tiny-hf-1b
      - qwen25-05b-hf
      - qwen25-3b-hf
  runtime:
    sample_limit: 50
    shuffle: true
    random_seed: 42
    fail_fast: false
  outputs:
    dir: results/pii-baseline
    save_rows: true
    save_metrics_json: true
