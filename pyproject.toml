[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-llm-benchmark"
version = "0.1.0"
description = "Benchmark pipeline for PII guard models across open and proprietary models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "ollama",
  "opencc",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "transformers>=4.56.1,<5.0.0",
  "huggingface_hub>=0.32.0",
  "torch>=2.5.1",
  "accelerate>=1.12.0",
  "numpy>=2.2.6",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
]

[project.scripts]
guardian-benchmark = "benchmarking.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["benchmarking*"]
