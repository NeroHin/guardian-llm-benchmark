[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-llm-benchmark"
version = "0.1.0"
description = "Benchmark pipeline for PII guard models across open and proprietary models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "ollama",
  "opencc",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "transformers>=4.56.1,<5.0.0",
  "huggingface_hub>=0.32.0",
  "torch==2.5.1",
  "accelerate>=1.12.0",
  "numpy>=2.2.6",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
granite-ssm-cu11-torch25-cxx11abi-false = [
  "mamba-ssm @ https://github.com/state-spaces/mamba/releases/download/v2.3.0/mamba_ssm-2.3.0+cu11torch2.5cxx11abiFALSE-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.0/causal_conv1d-1.6.0+cu11torch2.5cxx11abiFALSE-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
granite-ssm-cu11-torch25-cxx11abi-true = [
  "mamba-ssm @ https://github.com/state-spaces/mamba/releases/download/v2.3.0/mamba_ssm-2.3.0+cu11torch2.5cxx11abiTRUE-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.0/causal_conv1d-1.6.0+cu11torch2.5cxx11abiTRUE-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
guardian-benchmark = "benchmarking.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["benchmarking*"]
